# =========================================================================
# LOCAL 개발 프로파일 (실행: --spring.profiles.active=local)
# 원본 application.properties 를 덮어써서 로컬(도커) 리소스에 붙게 한다.
# 여기에는 실제 비밀키를 넣지 말 것(placeholder 기본값만).
# =========================================================================

# ----- MySQL (docker-compose, 호스트 포트 3307) -----
spring.datasource.url=jdbc:mysql://localhost:3307/postura?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=postura

# ----- Redis (docker-compose) -----
spring.data.redis.host=localhost
spring.data.redis.port=6379

# ----- OAuth2 (로컬 기본값) -----
# 소셜 로그인을 실제로 쓰려면 아래 env 를 진짜 값으로 채우고,
# 각 콘솔(Google/Kakao)에 http://localhost:8080/login/oauth2/code/{provider} 리다이렉트를 등록해야 함.
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:local-google-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:local-google-secret}
spring.security.oauth2.client.registration.google.redirect-uri=http://localhost:8080/login/oauth2/code/google

spring.security.oauth2.client.registration.kakao.client-id=${KAKAO_CLIENT_ID:local-kakao-id}
spring.security.oauth2.client.registration.kakao.client-secret=${KAKAO_CLIENT_SECRET:local-kakao-secret}
spring.security.oauth2.client.registration.kakao.redirect-uri=http://localhost:8080/login/oauth2/code/kakao

# OAuth 로그인 성공 후 프론트로 리다이렉트할 주소 (프론트 dev 포트=3000)
app.oauth2.authorized-redirect-uri=http://localhost:3000/oauth/redirect

# ----- 로컬은 HTTPS 프록시 없음 -----
server.forward-headers-strategy=NONE

# ----- JWT (로컬 기본 시크릿) -----
jwt.secret=${JWT_SECRET:local-jwt-secret-key-please-change-me-32bytes}
